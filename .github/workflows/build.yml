name: build

on:
  push:
    branches: [main, csharp, "feat/**", "fix/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege: the job token only reads the repository. A job that needs more asks for it
# itself (job-level permissions replace these, they do not add to them).
permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the whole history, not just the last commit
          persist-credentials: false
      # gitleaks itself, pinned by version and SHA-256 (no third-party action in between).
      # Findings accepted by hand are listed in .gitleaksignore by exact fingerprint.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 \
            --log-opts="--full-history HEAD" .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # The tests and the replay tool, not the WPF app: on Linux the app's Windows-made lock file
      # cannot restore (System.Drawing.Common comes from the Windows Desktop framework there, NU1102).
      # windows-installer builds the app, also in locked mode. A lock file out of step with
      # Directory.Packages.props fails here (NU1004) instead of resolving something new.
      - run: |
          dotnet restore tests/Vox.Core.Tests --locked-mode
          dotnet restore tests/Vox.Engine.Tests --locked-mode
          dotnet restore tools/Vox.Replay --locked-mode
      - run: dotnet build tools/Vox.Replay -c Release --no-restore
      - run: |
          dotnet test tests/Vox.Core.Tests -c Release --no-restore --filter "Category!=Models"
          dotnet test tests/Vox.Engine.Tests -c Release --no-restore --filter "Category!=Models"

  windows-installer:
    needs: [test, secrets]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read # SignPath reads this job and downloads the unsigned artifact with the job token
    outputs:
      sha256: ${{ steps.sha256.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # win-x64 and self-contained come from Vox.App.csproj. Passing `-r win-x64` here would push the
      # RID onto Vox.Core and Vox.Engine too and break the locked restore (NU1004). The implicit
      # restore runs in locked mode because CI=true (Directory.Build.props).
      - name: Publish
        run: dotnet publish src/Vox.App -c Release -p:PublishReadyToRun=true -o publish
      # Inno Setup is downloaded from its GitHub release and checked against a pinned SHA-256, then
      # installed in portable mode to its own folder: whatever the runner image has preinstalled is
      # never used. Stay on 6.x (vox.iss targets Inno Setup 6).
      - name: Install Inno Setup
        id: inno
        shell: pwsh
        env:
          INNO_VERSION: 6.7.3
          INNO_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'is-' + $env:INNO_VERSION.Replace('.', '_')
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_VERSION.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNO_VERSION.exe" -OutFile $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup installer SHA-256 mismatch: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP 'innosetup'
          $installArgs = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', '/PORTABLE=1', "/DIR=`"$dir`""
          $proc = Start-Process $setup -ArgumentList $installArgs -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Inno Setup install failed with exit code $($proc.ExitCode)" }
          $iscc = Join-Path $dir 'ISCC.exe'
          $info = (Get-Item $iscc).VersionInfo
          $version = '{0}.{1}.{2}' -f $info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart
          if ($version -ne $env:INNO_VERSION) { throw "ISCC.exe is $version, expected $env:INNO_VERSION" }
          "iscc=$iscc" >> $env:GITHUB_OUTPUT
      - name: Inno Setup
        shell: pwsh
        env:
          ISCC: ${{ steps.inno.outputs.iscc }}
        run: |
          $out = & $env:ISCC vox.iss 2>&1
          $code = $LASTEXITCODE
          $out | Write-Output
          if ($code -ne 0) {
            # Surface the compiler's error as annotations (readable without downloading logs).
            $out | Select-Object -Last 8 | ForEach-Object { Write-Output "::error title=ISCC::$_" }
            exit $code
          }
      # Release tags only: SignPath Foundation (free for open source) signs the installer once the
      # project is accepted and the repository variables/secret below exist (docs/adr/032).
      # Until then this is skipped and the installer stays unsigned.
      - name: Upload unsigned installer for signing
        id: unsigned
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: vox-setup-unsigned-${{ github.sha }}
          path: installer/vox-setup.exe
          retention-days: 1
      # Pinned by commit SHA, not by tag: the only third-party action here, and it gets the SignPath
      # token. Dependabot keeps the SHA and the version comment up to date.
      - name: Sign installer (SignPath)
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: vox
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 21600 # approved by hand; 6 h is the job limit
          output-artifact-directory: installer
      # The hash of the final (signed, if signing ran) installer. Besides the .sha256 file in the
      # artifact, it goes to the job summary and an annotation: the run page is a place the
      # artifact cannot rewrite, so a downloaded installer can be checked against it.
      - name: SHA-256
        id: sha256
        shell: pwsh
        env:
          SIGNED: ${{ steps.unsigned.outcome == 'success' && 'yes (SignPath)' || 'no' }}
        run: |
          $hash = (Get-FileHash installer\vox-setup.exe -Algorithm SHA256).Hash
          $hash | Tee-Object installer\vox-setup.exe.sha256
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Output "::notice title=vox-setup.exe SHA-256::$hash"
          @(
            '### vox-setup.exe'
            ''
            '| | |'
            '|---|---|'
            "| SHA-256 | ``$hash`` |"
            "| Commit | ``$env:GITHUB_SHA`` |"
            "| Ref | ``$env:GITHUB_REF`` |"
            "| Signed | $env:SIGNED |"
            ''
            'Check a downloaded file: `(Get-FileHash .\vox-setup.exe -Algorithm SHA256).Hash`'
          ) | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: vox-setup-${{ github.sha }}
          path: |
            installer/vox-setup.exe
            installer/vox-setup.exe.sha256
          retention-days: 14

  # Release tags only: a signed SLSA build provenance attestation (Sigstore, free for public
  # repositories) that ties vox-setup.exe to this workflow run and commit. Check a download with
  #   gh attestation verify vox-setup.exe --repo privatekey7/Vox
  # A separate job, so the OIDC token permission never exists in the job that builds.
  provenance:
    needs: windows-installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate
      attestations: write # store the attestation in the repository
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vox-setup-${{ github.sha }}
          path: installer
      - name: Same file as built
        env:
          EXPECTED: ${{ needs.windows-installer.outputs.sha256 }}
        run: |
          set -euo pipefail
          actual="$(sha256sum installer/vox-setup.exe | cut -d' ' -f1)"
          if [ "${actual,,}" != "${EXPECTED,,}" ]; then
            echo "::error::vox-setup.exe SHA-256 $actual differs from the build job's $EXPECTED"
            exit 1
          fi
      - uses: actions/attest@v4
        with:
          subject-path: installer/vox-setup.exe
