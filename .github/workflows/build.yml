name: build

on:
  push:
    branches: [main, csharp, "feat/**", "fix/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # Builds the whole solution (the WPF app too, via EnableWindowsTargeting) and runs the
      # tests that need no speech models.
      - run: dotnet test Vox.sln -c Release --filter "Category!=Models"

  windows-installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish
        run: dotnet publish src/Vox.App -c Release -r win-x64 --self-contained -p:PublishReadyToRun=true -o publish
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc vox.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: SHA-256
        shell: pwsh
        run: (Get-FileHash installer\vox-setup.exe -Algorithm SHA256).Hash | Tee-Object installer\vox-setup.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: vox-setup-${{ github.sha }}
          path: |
            installer/vox-setup.exe
            installer/vox-setup.exe.sha256
          retention-days: 14
