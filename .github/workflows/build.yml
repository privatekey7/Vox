name: build

on:
  push:
    branches: [main, csharp, "feat/**", "fix/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # The whole solution, the WPF app included (EnableWindowsTargeting): `dotnet test` alone
      # only builds what the tests reference.
      - run: dotnet build Vox.sln -c Release
      - run: dotnet test Vox.sln -c Release --no-build --filter "Category!=Models"

  windows-installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish
        run: dotnet publish src/Vox.App -c Release -r win-x64 --self-contained -p:PublishReadyToRun=true -o publish
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          $out = & $iscc vox.iss 2>&1
          $code = $LASTEXITCODE
          $out | Write-Output
          if ($code -ne 0) {
            # Surface the compiler's error as annotations (readable without downloading logs).
            $out | Select-Object -Last 8 | ForEach-Object { Write-Output "::error title=ISCC::$_" }
            exit $code
          }
      # Release tags only: SignPath Foundation (free for open source) signs the installer once the
      # project is accepted and the repository variables/secret below exist (docs/adr/032).
      # Until then this is skipped and the installer stays unsigned.
      - name: Upload unsigned installer for signing
        id: unsigned
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: vox-setup-unsigned-${{ github.sha }}
          path: installer/vox-setup.exe
          retention-days: 1
      - name: Sign installer (SignPath)
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: vox
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 21600 # approved by hand; 6 h is the job limit
          output-artifact-directory: installer
      - name: SHA-256
        shell: pwsh
        run: (Get-FileHash installer\vox-setup.exe -Algorithm SHA256).Hash | Tee-Object installer\vox-setup.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: vox-setup-${{ github.sha }}
          path: |
            installer/vox-setup.exe
            installer/vox-setup.exe.sha256
          retention-days: 14
