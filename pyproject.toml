[project]
name = "vox"
version = "1.3.0"
description = "Offline push-to-talk voice-to-text for Windows"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "sherpa-onnx>=1.13.8",
    "sounddevice>=0.4.6",
    "keyboard>=0.13.5",
    "pyperclip>=1.8.2",
    "numpy>=1.24.0",
    "pystray>=0.19.5",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
    "pip-audit>=2.7",
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # do not perform function call in argument defaults
    "B027",    # empty method in abstract class without @abstract
    "SIM115",  # open() without context manager (log file needs to stay open)
    "RUF001",  # ambiguous unicode — expected in Russian-language app
    "RUF002",  # ambiguous unicode in docstrings
    "RUF003",  # ambiguous unicode in comments
]

[tool.ruff.lint.isort]
known-first-party = ["voxapp"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # relax for now — tighten incrementally
check_untyped_defs = true
ignore_missing_imports = true  # many deps lack stubs (sherpa_onnx, pystray, etc.)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
